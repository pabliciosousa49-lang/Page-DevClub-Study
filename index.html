<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeStudy - Bloco de Estudos</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <!-- Cabeçalho -->
    <header class="cabecalho">
        <h1 class="titulo-principal">CodeStudy</h1>
        <p class="subtitulo-principal"> Entenda seu código. Teste seu conhecimento. Salve seu aprendizado. </p>
    </header>

    <!-- Conteúdo principal -->
    <main class="conteudo-principal"> <!-- Etapa 1: Abrir Bloco -->
        <section id="abrir-bloco" class="etapa">

            <h2 class="titulo-etapa">Abrir Bloco</h2>
            <p class="descricao-etapa"> Informe o que você está estudando para iniciar um novo bloco. </p>
            <form id="formulario-bloco" class="formulario">

                <div class="campo-formulario"> <label for="titulo-trecho"> Qual trecho você está trabalhando? </label>
                    <input type="text" id="titulo-trecho" name="titulo-trecho"
                        placeholder="Ex: Eventos de clique no JavaScript" required>
                </div>

                <div class="campo-formulario"> <label for="linguagem"> Qual linguagem você está trabalhando? </label>

                    <select id="linguagem" name="linguagem" required>
                        <option value="">Selecione uma linguagem</option>
                        <option value="html">HTML</option>
                        <option value="css">CSS</option>
                        <option value="javascript">JavaScript</option>
                        <option value="react">React</option>
                        <option value="outra">Outra</option>
                    </select>

                </div>
                
                <div class="grupo-botoes"> <button type="button" id="continuar-btn" class="botao-principal"> Continuar </button> </div>
                </form>
        </section>

        <!-- Etapa 2: Inserir Código -->
        <section id="inserir-codigo" class="etapa">
            <h2 class="titulo-etapa">Inserir Código</h2>

            <div class="informacoes-bloco">
                <p> <strong>Trecho:</strong> <span id="titulo-trecho-exibicao"> Eventos de clique no JavaScript </span> </p>
                <p> <strong>Linguagem:</strong> <span id="linguagem-exibicao"> JavaScript </span> </p>
            </div>

            <div class="campo-formulario"> <label for="codigo-input"> Cole seu trecho de código: </label> <textarea
                    id="codigo-input" name="codigo" rows="15" placeholder="Cole seu código aqui..."></textarea> </div>
            <div class="grupo-botoes"> <button type="button" id="voltar-inicio-btn" class="botao-secundario"> Voltar </button>

            <button type="button" id="analisar-btn" class="botao-principal"> Analisar </button> </div>
        </section>

        <script src="./js/storage.js"></script>
        <script src="./js/api.js"></script>
        <script src="./js/quiz.js"></script>
        <script src="./js/app.js"></script>
</body>

</html>
